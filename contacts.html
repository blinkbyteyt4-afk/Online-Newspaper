<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Наші контакти</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__container container">
        <a href="./index.html" class="header__logo logo">Newspaper</a>
        <nav class="header__nav">
          <ul class="header__nav-list">
            <li class="header__nav-item">
              <a href="./index.html" class="header__nav-link"
                >Головна сторінка</a
              >
            </li>
            <li class="header__nav-item">
              <a href="./contacts.html" class="header__nav-link">Контакти</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="main">
      <section class="contacts-section" style="padding: 40px 0">
        <div
          class="container"
          style="
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
          "
        >
          <h1 style="text-align: center; margin-bottom: 30px">Наші контакти</h1>

          <div class="contacts-wrap">
            <ul
              class="contacts-list"
              style="list-style: none; padding: 0; margin-bottom: 30px"
            >
              <li
                class="contact-item"
                style="margin-bottom: 20px; text-align: center"
              >
                <p
                  class="contact-text"
                  style="font-weight: bold; margin-bottom: 5px"
                >
                  Ви можете зателефонувати нам за номером:
                </p>
                <a
                  href="tel:+380730000000"
                  class="contact-link"
                  style="
                    color: #007bff;
                    text-decoration: none;
                    font-size: 1.1em;
                  "
                  >+380730000000</a
                >
              </li>
              <li
                class="contact-item"
                style="margin-bottom: 20px; text-align: center"
              >
                <p
                  class="contact-text"
                  style="font-weight: bold; margin-bottom: 5px"
                >
                  Якщо у вас є цікаві новини:
                </p>
                <a
                  href="mailto:newspaper@gmail.com"
                  class="contact-link"
                  style="
                    color: #007bff;
                    text-decoration: none;
                    font-size: 1.1em;
                  "
                  >newspaper@gmail.com</a
                >
              </li>
            </ul>

            <div
              class="contact-address"
              style="text-align: center; margin-top: 30px"
            >
              <p
                class="contact-text"
                style="font-weight: bold; margin-bottom: 15px"
              >
                Завітайте до нас в офіс за адресою м. Київ, вул. Хрещатик
              </p>
              <img
                src="./img/map.png"
                alt="address"
                class="contact-img"
                style="
                  width: 100%;
                  max-width: 600px;
                  display: block;
                  margin: 0 auto;
                  border-radius: 6px;
                "
              />
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer__container container">
        <a href="./index.html" class="footer__logo logo">Newspaper</a>
        <div class="footer__contacts">
          <p>+380730000000</p>
          <p>newspaper@gmail.com</p>
        </div>
      </div>
    </footer>
  </body>
</html>
